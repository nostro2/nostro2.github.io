        description: | # this will include new lines to allow paragraphs
          Worked with a GIS consultancy to transform early stage wireframes into a production ready MVP. Met directly with the client and end users to scope requirements and gather feedback throughout delivery. Designed and implemented a serverless AWS architecture, terraform based infrastructure and GitHub Actions CI/CD pipelines. Leveraged AI assisted software development practices to accelerate delivery, successfully launching the first MVP within one week and presenting the solution at the VibeHops AI meetup in Colchester.

